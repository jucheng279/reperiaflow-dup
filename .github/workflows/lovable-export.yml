name: Lovable export

on:
  push:
    branches: [lovable-export]

permissions:
  contents: write

jobs:
  export:
    if: ${{ !contains(github.event.head_commit.message, '[export-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package source into text chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lovable-export
          mkdir -p .lovable-export
          tar \
            --exclude='.git' \
            --exclude='.lovable-export' \
            --exclude='node_modules' \
            --exclude='dist' \
            -czf /tmp/reperiaflow-source.tar.gz .
          base64 -w 76 /tmp/reperiaflow-source.tar.gz > /tmp/reperiaflow-source.b64
          split -b 70000 -d -a 3 /tmp/reperiaflow-source.b64 .lovable-export/chunk-
          sha256sum /tmp/reperiaflow-source.tar.gz | awk '{print $1}' > .lovable-export/archive.sha256
          ls -1 .lovable-export/chunk-* | sort | xargs -n1 basename > .lovable-export/manifest.txt
      - name: Commit export chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .lovable-export
          git commit -m 'chore: generate Lovable source export [export-generated]'
          git push
